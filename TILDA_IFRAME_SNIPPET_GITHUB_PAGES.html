    function applyViewportHeight() {
      var h = window.innerHeight || document.documentElement.clientHeight || 900;
      frame.style.height = h + "px";
      frame.style.minHeight = h + "px";
    }

    function sendConfig() {
      if (!frame.contentWindow) return;
      try {
        frame.contentWindow.postMessage({ type: "LIZA_TEXT_CONFIG", config: LIZA_TEXT_CONFIG }, "*");
      } catch (_e) {}
    }

    function findShadowForm() {
      return document.querySelector(".liza-shadow-form-wrap form, .uc-liza-shadow-form-wrap form");
    }

    function upsertHidden(form, name, value) {
      var input = form.querySelector('input[type="hidden"][name="' + name + '"]');
      if (!input) {
        input = document.createElement("input");
        input.type = "hidden";
        input.name = name;
        form.appendChild(input);
      }
      input.value = value == null ? "" : String(value);
    }

    function findBestInput(form, variants, type) {
      var fields = form.querySelectorAll("input, textarea, select");
      for (var i = 0; i < fields.length; i += 1) {
        var field = fields[i];
        if (!field) continue;
        if (type && field.type && field.type !== type) continue;
        var haystack = [
          field.name || "",
          field.placeholder || "",
          field.getAttribute("aria-label") || "",
          field.getAttribute("data-original-title") || ""
        ].join(" ").toLowerCase();
        for (var j = 0; j < variants.length; j += 1) {
          if (haystack.indexOf(variants[j]) !== -1) return field;
        }
      }
      return null;
    }

    function fillShadowForm(payload) {
      var form = findShadowForm();
      if (!form) return;

      var nameInput = findBestInput(form, ["имя", "name"], "text");
      var phoneInput = findBestInput(form, ["телефон", "phone"], "tel") || findBestInput(form, ["телефон", "phone"]);
      var salonInput = findBestInput(form, ["салон", "компания", "название"], "text");

      if (nameInput) nameInput.value = payload.name || "";
      if (phoneInput) phoneInput.value = payload.phone || "";
      if (salonInput) salonInput.value = payload.salonName || "";

      upsertHidden(form, "uses_yclients", payload.usesYclients || "");
      upsertHidden(form, "quote_summary", payload.quoteSummary || "");
      upsertHidden(form, "tariff_name", payload.tariffName || "");
      upsertHidden(form, "limit_label", payload.limitLabel || "");
      upsertHidden(form, "channels_count", payload.channelsCount || "");
      upsertHidden(form, "monthly_result", payload.monthlyResult || "");
      upsertHidden(form, "selected_channels", payload.selectedChannels || "");
      upsertHidden(form, "yearly_billing", payload.yearlyBilling || "");
      upsertHidden(form, "source_page", payload.sourcePage || "");
      upsertHidden(form, "submitted_at", payload.submittedAt || "");

      var submitButton = form.querySelector('[type="submit"]');
      if (form.requestSubmit) form.requestSubmit(submitButton || undefined);
      else if (submitButton && submitButton.click) submitButton.click();
      else form.submit();
    }

    window.addEventListener("message", function (event) {
      var data = event && event.data;
      if (!data || typeof data !== "object") return;
      if (data.type === "LIZA_IFRAME_HEIGHT" && typeof data.height === "number" && data.height > 0) {
        frame.style.height = data.height + "px";
        frame.style.minHeight = data.height + "px";
        return;
      }
      if (data.type === "LIZA_LEAD_SUBMIT") {
        fillShadowForm(data.payload || {});
      }
    });

    frame.addEventListener("load", function () {
      applyViewportHeight();
      sendConfig();
      setTimeout(sendConfig, 250);
      setTimeout(sendConfig, 1000);
      setTimeout(sendConfig, 2200);
    });

    window.addEventListener("resize", applyViewportHeight);
    applyViewportHeight();
