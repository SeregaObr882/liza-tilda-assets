  <body>
  <div id="liza-tilda-root"></div>
  <div id="liza-bootstrap-overlay" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;background:#f2f5fb;">
    <div style="max-width:900px;width:100%;padding:32px 28px;border:1px solid #d8e5fb;border-radius:28px;background:#fff;box-shadow:0 16px 36px rgba(35,77,126,.12);font-family:Inter,system-ui,sans-serif;color:#13263a;">
      <h1 style="margin:0 0 12px;font-size:32px;line-height:1.05;">Загружаем сайт</h1>
      <p style="margin:0;font-size:18px;line-height:1.5;color:#42566f;">Если страница откроется не сразу, обновим сборку автоматически.</p>
    </div>
  </div>
  <script>
    (function () {
      var root = document.getElementById("liza-tilda-root");
      var overlay = document.getElementById("liza-bootstrap-overlay");
      var attempts = 0;
      var maxAttempts = 2;

      function hasRenderedContent() {
        if (!root) return false;
        return !!root.querySelector("*");
      }

      function hideOverlay() {
        if (overlay) overlay.style.display = "none";
      }

      function showFatalState(reason) {
        if (!overlay) return;
        overlay.innerHTML =
          '<div style="max-width:900px;width:100%;padding:32px 28px;border:1px solid #d8e5fb;border-radius:28px;background:#fff;box-shadow:0 16px 36px rgba(35,77,126,.12);font-family:Inter,system-ui,sans-serif;color:#13263a;">' +
          '<h1 style="margin:0 0 12px;font-size:32px;line-height:1.05;">Сайт загружается с ошибкой</h1>' +
          '<p style="margin:0 0 10px;font-size:18px;line-height:1.5;color:#42566f;">Основной скрипт страницы не смог корректно отрисовать контент.</p>' +
          '<p style="margin:0;font-size:14px;line-height:1.5;color:#6b7c93;">Причина: ' + String(reason || "unknown") + '</p>' +
          '</div>';
        overlay.style.display = "flex";
      }

      function scheduleRenderCheck(tag) {
        setTimeout(function () {
          if (hasRenderedContent()) {
            hideOverlay();
            return;
          }
          if (attempts < maxAttempts) {
            loadBundle("empty-render:" + tag);
          } else {
            showFatalState("empty-render");
          }
        }, 2200);
      }

      function loadBundle(reason) {
        attempts += 1;
        var script = document.createElement("script");
        script.src = "./liza-app.js?v=14&try=" + attempts + "&ts=" + Date.now();
        script.async = false;
        script.onload = function () {
          scheduleRenderCheck("load-" + attempts);
        };
        script.onerror = function () {
          if (attempts < maxAttempts) {
            loadBundle("load-error");
          } else {
            showFatalState("load-error");
          }
        };
        document.body.appendChild(script);
      }

      window.addEventListener("error", function (event) {
        if (attempts >= maxAttempts && !hasRenderedContent()) {
          showFatalState(event && event.message ? event.message : "runtime-error");
        }
      });

      loadBundle("initial");
    })();
  </script>
  <script>
    (function () {
      function sendParentHeight() {
        if (window.parent === window) return;
        var body = document.body;
        var doc = document.documentElement;
        if (!body || !doc) return;
        var height = Math.max(
          body.scrollHeight || 0,
          body.offsetHeight || 0,
          doc.clientHeight || 0,
          doc.scrollHeight || 0,
          doc.offsetHeight || 0
        );
        try {
          window.parent.postMessage({ type: "LIZA_IFRAME_HEIGHT", height: height }, "*");
        } catch (_e) {}
      }

      function scheduleHeightSync() {
        sendParentHeight();
        setTimeout(sendParentHeight, 120);
        setTimeout(sendParentHeight, 480);
        setTimeout(sendParentHeight, 1200);
      }

      window.addEventListener("load", scheduleHeightSync, { once: true });
      window.addEventListener("resize", sendParentHeight);
      document.addEventListener("readystatechange", function () {
        if (document.readyState === "interactive" || document.readyState === "complete") {
          scheduleHeightSync();
        }
      });

      if (window.ResizeObserver) {
        var observer = new ResizeObserver(function () {
          sendParentHeight();
        });
        if (document.body) observer.observe(document.body);
        else window.addEventListener("load", function () {
          if (document.body) observer.observe(document.body);
        }, { once: true });
      }
    })();
  </script>
