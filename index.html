<!doctype html>
<!-- DEPLOY_ID: v7-2026-04-03-marketing-refresh -->
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liza Bot Landing</title>
  <link rel="stylesheet" href="./liza-app.css?v=14" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: #f2f5fb;
    }
    #liza-tilda-root {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    .liza-old-content {
      display: none !important;
    }

    .liza-benefits-rebuild,
    .liza-outcomes-rebuild {
      margin-top: 24px;
      display: grid;
      gap: 18px;
    }

    .liza-benefits-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .liza-benefit-card {
      border: 1px solid #d9e5f8;
      background: linear-gradient(170deg, #ffffff 0%, #f7faff 100%);
      border-radius: 30px;
      padding: 28px 30px;
      min-height: 220px;
      box-shadow: 0 18px 38px rgba(33, 73, 121, 0.1);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      gap: 0 24px;
      align-items: start;
    }

    .liza-benefit-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 38px rgba(33, 73, 121, 0.14);
      border-color: #bdd4fb;
    }

    .liza-benefit-icon {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 20px 40px rgba(52, 91, 179, 0.28);
      background: linear-gradient(138deg, #2f66ff 0%, #7a33ff 100%);
      grid-row: 1 / span 2;
    }

    .liza-benefit-icon svg {
      width: 44px;
      height: 44px;
      stroke: currentColor;
    }

    .liza-benefit-content {
      display: grid;
      gap: 8px;
      align-content: start;
      min-width: 0;
    }

    .liza-benefit-kicker {
      margin: 0;
      display: inline-flex;
      align-items: center;
      justify-self: start;
      border-radius: 999px;
      border: 1px solid #d2e2ff;
      background: #eef4ff;
      color: #2a64d1;
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .liza-benefit-title {
      margin: 0 0 8px;
      color: #10253a;
      font-size: 1.35rem;
      font-weight: 850;
      line-height: 1.25;
    }

    .liza-benefit-copy {
      margin: 0;
      color: #3b4e64;
      font-size: 1.04rem;
      line-height: 1.58;
      white-space: pre-line;
    }

    .liza-outcomes-lead {
      background: #eef3ff;
      border: 1px solid #cfe0ff;
      border-radius: 18px;
      padding: 18px 20px;
      color: #2a4665;
      line-height: 1.5;
      font-size: clamp(1.06rem, 1.02rem + 0.38vw, 1.24rem);
      font-weight: 520;
    }

    .liza-outcomes-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .liza-outcome-card {
      border: 1px solid #d8e6fb;
      background: #fff;
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 12px 28px rgba(34, 79, 132, 0.1);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .liza-outcome-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(34, 79, 132, 0.14);
      border-color: #bfd5ff;
    }

    .liza-outcome-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .liza-outcome-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 10px 24px rgba(56, 92, 187, 0.34);
      background: linear-gradient(135deg, #2f66ff 0%, #7a33ff 100%);
      flex-shrink: 0;
    }

    .liza-outcome-icon svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
    }

    .liza-outcome-title {
      margin: 0;
      color: #10253a;
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1.28;
    }

    .liza-outcome-copy {
      margin: 0;
      color: #3b4e64;
      font-size: 0.97rem;
      line-height: 1.5;
    }

    .liza-outcome-metric {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 700;
      color: #1f5fce;
      background: #edf4ff;
      border: 1px solid #d7e7ff;
    }

    .liza-pricing-shell {
      margin-top: 20px;
      display: grid;
      grid-template-columns: minmax(0, 1.75fr) minmax(280px, 1fr);
      gap: 16px;
      align-items: stretch;
    }

    .liza-pricing-widget {
      background: #fff;
      border-radius: 26px;
      border: 1px solid #d8e5fb;
      box-shadow: 0 16px 36px rgba(35, 77, 126, 0.12);
      padding: 20px;
      color: #12263a;
      display: grid;
      gap: 12px;
    }

    .liza-pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .liza-plan {
      border: 1px solid #d8e5fb;
      border-radius: 18px;
      padding: 12px;
      background: #f9fbff;
      cursor: pointer;
      transition: 0.18s ease;
      min-height: 140px;
    }

    .liza-plan input {
      display: none;
    }

    .liza-plan.active {
      background: linear-gradient(135deg, #eef5ff 0%, #ebeefe 100%);
      border-color: #4a87ff;
      box-shadow: 0 10px 22px rgba(42, 102, 201, 0.2);
    }

    .liza-plan-name {
      margin: 0 0 7px;
      font-weight: 800;
      font-size: 1.04rem;
      color: #102a45;
    }

    .liza-plan-price {
      margin: 0;
      font-size: 1.38rem;
      font-weight: 900;
      color: #1d5ed0;
      letter-spacing: -0.01em;
    }

    .liza-plan-meta {
      margin-top: 8px;
      color: #516882;
      font-size: 0.86rem;
      line-height: 1.36;
    }

    .liza-plan-desc {
      margin: 4px 0 0;
      color: #5d6f84;
      font-size: 0.84rem;
      line-height: 1.35;
    }

    .liza-pricing-row-title {
      margin: 2px 0 2px;
      font-size: 0.94rem;
      font-weight: 800;
      color: #233f5b;
    }

    .liza-pricing-row-hint {
      margin: -2px 0 2px;
      color: #5b6f87;
      font-size: 0.84rem;
      line-height: 1.42;
    }

    .liza-messenger-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .liza-ms-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #d2e0f8;
      border-radius: 14px;
      padding: 9px 11px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #26445f;
      background: #f8fbff;
      user-select: none;
      cursor: pointer;
      transition: .18s ease;
    }

    .liza-ms-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .liza-ms-icon {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.67rem;
      font-weight: 800;
      letter-spacing: 0.01em;
      box-shadow: 0 6px 14px rgba(46, 74, 130, 0.22);
      flex-shrink: 0;
    }

    .liza-ms-icon--telegram { background: linear-gradient(135deg, #2aabee 0%, #1b7fd6 100%); }
    .liza-ms-icon--whatsapp { background: linear-gradient(135deg, #2ec866 0%, #1d9a4c 100%); }
    .liza-ms-icon--vk { background: linear-gradient(135deg, #3a6fe8 0%, #2855c3 100%); }
    .liza-ms-icon--max { background: linear-gradient(135deg, #5f7cff 0%, #7c3bff 100%); }
    .liza-ms-icon--default { background: linear-gradient(135deg, #4f7fff 0%, #5a62d4 100%); }

    .liza-ms-item.active {
      border-color: #5692ff;
      background: #eaf2ff;
      box-shadow: inset 0 0 0 1px rgba(73, 131, 255, 0.18);
    }

    .liza-ms-item input {
      accent-color: #2b76ff;
      width: 15px;
      height: 15px;
    }

    .liza-pricing-note-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .liza-pricing-note {
      border: 1px solid #d9e7ff;
      border-radius: 14px;
      padding: 10px 12px;
      background: #f8fbff;
      color: #3d5670;
      font-size: 0.86rem;
      line-height: 1.35;
    }

    .liza-pricing-note strong {
      color: #1c3653;
      display: block;
      margin-bottom: 4px;
    }

    .liza-pricing-aside {
      border-radius: 26px;
      border: 1px solid rgba(102, 128, 255, 0.28);
      background: linear-gradient(155deg, #2f66ff 0%, #4d4bf5 52%, #6f2dff 100%);
      box-shadow: 0 24px 44px rgba(60, 65, 166, 0.32);
      color: #fff;
      padding: 20px;
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .liza-aside-kicker {
      margin: 0;
      font-size: 0.84rem;
      font-weight: 600;
      color: rgba(236, 243, 255, 0.9);
    }

    .liza-aside-title {
      margin: 0;
      font-size: 2rem;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .liza-pricing-summary {
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.14);
      padding: 14px;
      display: grid;
      gap: 4px;
    }

    .liza-summary-big {
      font-size: 2.05rem;
      font-weight: 900;
      color: #fff;
      line-height: 1.06;
      letter-spacing: -0.015em;
    }

    .liza-summary-line {
      font-size: 0.92rem;
      color: rgba(239, 245, 255, 0.96);
      line-height: 1.45;
    }

    .liza-pricing-cta {
      margin-top: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      border: none;
      text-decoration: none;
      font-size: 0.98rem;
      font-weight: 800;
      color: #1744c2;
      background: #fff;
      transition: transform .14s ease, box-shadow .14s ease;
      box-shadow: 0 10px 22px rgba(15, 22, 62, 0.22);
    }

    .liza-pricing-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 26px rgba(15, 22, 62, 0.28);
    }

    .liza-footer-clean {
      background: #ffffff;
      margin-top: 24px;
      border-top: 1px solid #dbe6f6;
    }

    .liza-footer-inner {
      max-width: 1420px;
      margin: 0 auto;
      padding: 28px 24px 34px;
    }

    .liza-footer-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .liza-footer-col {
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .liza-footer-col--center {
      justify-items: center;
      text-align: center;
    }

    .liza-footer-col--right {
      justify-items: end;
      text-align: right;
    }

    .liza-footer-link,
    .liza-footer-text {
      color: #13253a;
      font-size: clamp(1rem, 0.98rem + 0.22vw, 1.12rem);
      line-height: 1.4;
      text-decoration: none;
    }

    .liza-footer-link {
      transition: color 0.18s ease, opacity 0.18s ease;
    }

    .liza-footer-link:hover {
      color: #2a64d1;
    }

    .liza-footer-socials {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .liza-footer-social {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #4f43e3;
      border: 1px solid #d9e4fb;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 10px 24px rgba(56, 86, 139, 0.14);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, color 0.16s ease, background 0.16s ease;
    }

    .liza-footer-social:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(56, 86, 139, 0.18);
      border-color: #c8d9fb;
      color: #2b63da;
      background: #f8fbff;
    }

    .liza-footer-social svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      stroke: none;
    }

    .liza-hero-chip {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid #d8e4f7;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 10px 22px rgba(34, 72, 120, 0.08);
      color: #36506b;
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
    }

    @keyframes lizaHeroFloatA {
      0% { transform: translate3d(0, 0, 0) rotate(-2deg) scale(1); }
      25% { transform: translate3d(-5px, -10px, 0) rotate(-4deg) scale(1.02); }
      50% { transform: translate3d(6px, -20px, 0) rotate(2deg) scale(1.04); }
      75% { transform: translate3d(-3px, -9px, 0) rotate(-1deg) scale(1.02); }
      100% { transform: translate3d(0, 0, 0) rotate(-2deg) scale(1); }
    }

    @keyframes lizaHeroFloatB {
      0% { transform: translate3d(0, 0, 0) rotate(3deg) scale(1); }
      30% { transform: translate3d(7px, -14px, 0) rotate(5deg) scale(1.03); }
      60% { transform: translate3d(-4px, -18px, 0) rotate(1deg) scale(1.05); }
      100% { transform: translate3d(0, 0, 0) rotate(3deg) scale(1); }
    }

    @keyframes lizaHeroFloatC {
      0% { transform: translate3d(0, 0, 0) rotate(-1deg) scale(1); }
      20% { transform: translate3d(-8px, -8px, 0) rotate(-4deg) scale(1.01); }
      55% { transform: translate3d(3px, -22px, 0) rotate(3deg) scale(1.04); }
      100% { transform: translate3d(0, 0, 0) rotate(-1deg) scale(1); }
    }

    @keyframes lizaHeroFloatD {
      0% { transform: translate3d(0, 0, 0) rotate(1deg) scale(1); }
      35% { transform: translate3d(5px, -11px, 0) rotate(4deg) scale(1.02); }
      65% { transform: translate3d(-6px, -17px, 0) rotate(-2deg) scale(1.03); }
      100% { transform: translate3d(0, 0, 0) rotate(1deg) scale(1); }
    }

    .liza-hero-float {
      will-change: transform;
      transform-origin: 50% 50%;
    }

    #hero .liza-hero-visual > div:nth-of-type(2) .hero-float {
      animation: lizaHeroFloatA 6.9s ease-in-out infinite !important;
    }

    #hero .liza-hero-visual > div:nth-of-type(3) .hero-float {
      animation: lizaHeroFloatB 7.8s ease-in-out infinite !important;
    }

    #hero .liza-hero-visual > div:nth-of-type(4) .hero-float {
      animation: lizaHeroFloatC 8.4s ease-in-out infinite !important;
    }

    #hero .liza-hero-visual > div:nth-of-type(5) .hero-float {
      animation: lizaHeroFloatD 7.2s ease-in-out infinite !important;
    }

    .liza-gradient-bot-text {
      background: linear-gradient(90deg, #2f66ff 0%, #6a37ff 55%, #8e3dff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .liza-support-link-card {
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .liza-support-link-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 28px rgba(39, 76, 129, 0.12);
      border-color: #cdddf9;
    }

    #faq [style*="opacity: 0"] {
      opacity: 1 !important;
      transform: none !important;
    }

    .liza-support-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      border-radius: inherit;
    }

    @media (max-width: 1160px) {
      .liza-pricing-shell {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 1024px) {
      .liza-benefits-grid,
      .liza-outcomes-grid,
      .liza-pricing-grid,
      .liza-pricing-note-grid,
      .liza-messenger-row {
        grid-template-columns: 1fr;
      }

      .liza-footer-grid {
        grid-template-columns: 1fr;
      }

      .liza-footer-col,
      .liza-footer-col--center,
      .liza-footer-col--right {
        justify-items: start;
        text-align: left;
      }

      .liza-footer-socials {
        justify-content: flex-start;
      }
    }

    @media (max-width: 760px) {
      header {
        overflow-x: clip !important;
      }

      header > div {
        padding-left: 12px !important;
        padding-right: 12px !important;
      }

      header > div > div {
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) auto !important;
        min-height: 64px !important;
        gap: 10px !important;
        padding-left: 14px !important;
        padding-right: 14px !important;
        align-items: center !important;
      }

      header .liza-header-brand {
        display: block !important;
        flex: none !important;
        min-width: 0 !important;
        max-width: 100% !important;
        font-size: 1.22rem !important;
        line-height: 1 !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
      }

      header a[href="#lead-form"] {
        justify-self: end !important;
        min-height: 38px !important;
        max-width: min(50vw, 190px) !important;
        padding: 0 12px !important;
        font-size: 0.76rem !important;
        font-weight: 800 !important;
        line-height: 1.1 !important;
        white-space: nowrap !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        border-radius: 999px !important;
      }

      .liza-benefit-card {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 20px;
        min-height: 0;
      }

      .liza-benefit-icon {
        width: 76px;
        height: 76px;
        border-radius: 24px;
        grid-row: auto;
      }

      .liza-benefit-icon svg {
        width: 36px;
        height: 36px;
      }
    }

    #hero .liza-hero-shell {
      padding-top: 40px !important;
    }

    #hero .liza-hero-grid {
      min-height: 0 !important;
      align-items: start !important;
    }

    #hero .liza-hero-copy {
      max-width: 700px !important;
    }

    #hero .liza-hero-badge,
    #hero .liza-hero-chip {
      padding: 12px 22px !important;
      font-size: 16px !important;
      line-height: 1.1 !important;
      border-radius: 9999px !important;
    }

    #hero .liza-hero-badge {
      margin-bottom: 18px !important;
    }

    #hero .liza-hero-title {
      font-size: clamp(56px, 6vw, 84px) !important;
      line-height: 0.94 !important;
      margin-bottom: 18px !important;
      letter-spacing: -0.04em !important;
    }

    #hero .liza-hero-rotator {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 20px !important;
    }

    #hero .liza-hero-line {
      font-size: clamp(26px, 3vw, 46px) !important;
      line-height: 1.02 !important;
      letter-spacing: -0.03em !important;
      white-space: nowrap !important;
    }

    #hero .liza-hero-lead {
      max-width: 680px !important;
      font-size: clamp(17px, 1.05vw, 20px) !important;
      line-height: 1.45 !important;
      margin-bottom: 24px !important;
    }

    #hero a[href="#lead-form"] {
      margin-top: 0 !important;
    }

    #hero .liza-hero-visual {
      height: clamp(520px, 64vh, 760px) !important;
      max-width: 560px !important;
    }

    #hero .hero-float {
      animation-name: heroFloat !important;
      animation-duration: 4.4s !important;
      animation-iteration-count: infinite !important;
      animation-timing-function: ease-in-out !important;
      animation-play-state: running !important;
      transform-origin: center center !important;
    }

    #hero .hero-icon-shell {
      box-shadow: 0 16px 32px rgba(37, 99, 235, 0.18) !important;
    }

    header .liza-header-brand {
      font-size: 2.1rem !important;
      line-height: 0.95 !important;
      letter-spacing: -0.04em !important;
    }

    #pricing .liza-pricing-plan-grid {
      display: grid !important;
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      gap: 12px !important;
      align-items: stretch !important;

          '</div>';

        setTimeout(function () {

        var script = document.createElement("script");
        script.src = "./liza-app.js?v=14&try=" + attempts + "&ts=" + Date.now();
        script.async = false;

      function getButtonText(button) {
        return ((button && button.textContent) || "").trim().toLowerCase();
      }

      function getYClientsChoice(form) {
        var buttons = form.querySelectorAll('button[type="button"]');
        for (var i = 0; i < buttons.length; i += 1) {
          var button = buttons[i];
          var text = getButtonText(button);
          if (text !== "да" && text !== "нет") continue;
          var className = button.className || "";
          if (className.indexOf("border-blue-500") !== -1 || className.indexOf("bg-blue-50") !== -1) {
            return text === "да" ? "Да" : "Нет";
          }
        }
        return "";
      }

      function postLeadPayload(form) {
        if (!form) return;
        var now = Date.now();
        if (now - lastLeadSubmitAt < 1200) {
          logLead("submit:skip-duplicate");
          return;
        }
        lastLeadSubmitAt = now;
        activeLeadForm = form;
        clearTimeout(leadAckTimer);
        setLeadFormState(form, "submitting", "Отправляем заявку…");
        var payload = collectLeadPayload(form);
        logLead("submit:payload-collected", payload);
        try {
          window.parent.postMessage({ type: "LIZA_LEAD_SUBMIT", payload: payload }, "*");
          logLead("submit:payload-posted");
          leadAckTimer = setTimeout(function () {
            if (activeLeadForm === form) {
              setLeadFormState(form, "error", "Не удалось отправить заявку. Попробуйте ещё раз.");
            }
          }, 7000);
        } catch (_e) {}
      }

      function collectLeadPayload(form) {
        var phoneField = resolveNamedField(form, ["phone", "телефон"], "tel") || resolveNamedField(form, ["phone", "телефон"]);
        var nameField = resolveNamedField(form, ["name", "имя", "ваше имя"], "text");
        var salonField = resolveNamedField(form, ["salon_name", "название салона", "салон"], "text");
        var quoteField = form.querySelector('input[name="quote_summary"]');
        var quoteState = getQuoteState() || {};
        logLead("submit:field-match", {
          name: !!nameField,
          phone: !!phoneField,
          salon: !!salonField
        });

        return {
          name: nameField ? nameField.value.trim() : "",
          phone: phoneField ? phoneField.value.trim() : "",
          salonName: salonField ? salonField.value.trim() : "",
          usesYclients: getYClientsChoice(form),
          quoteSummary: quoteField ? quoteField.value.trim() : "",
          tariffName: quoteState.tariffName || "",
          limitLabel: quoteState.mastersCount || "",
          channelsCount: quoteState.channelsCount || "",
          monthlyResult: quoteState.monthlyResult || "",
          selectedChannels: quoteState.selectedChannels || "",
          yearlyBilling: quoteState.yearlyBilling ? "Да" : "Нет",
          sourcePage: window.location.href,
          submittedAt: new Date().toLocaleString("ru-RU")
        };
      }

      document.addEventListener("submit", function (event) {
        var form = event.target;
        if (!form || !form.matches || !form.matches("form")) return;
        if (!form.querySelector('input[name="quote_summary"]')) return;
        event.preventDefault();
        postLeadPayload(form);
      }, true);

      window.addEventListener("message", function (event) {
        var data = event && event.data;
        if (!data || typeof data !== "object") return;
        if (data.type !== "LIZA_LEAD_STATUS") return;
        if (!activeLeadForm) return;
        clearTimeout(leadAckTimer);
        if (data.status === "success") {
          setLeadFormState(activeLeadForm, "success", data.message || "Ваша заявка отправлена, скоро мы с вами свяжемся.");
          logLead("submit:success", data);
          return;
        }
        if (data.status === "submitting") {
          setLeadFormState(activeLeadForm, "submitting", data.message || "Отправляем заявку…");
          logLead("submit:bridge-submitting", data);
          return;
        }
        setLeadFormState(activeLeadForm, "error", data.message || "Не удалось отправить заявку.");
        logLead("submit:error", data);
      });
    })();
  </script>
  <script>
    (function () {
      function sendParentHeight() {
        if (window.parent === window) return;
        var body = document.body;
        var doc = document.documentElement;
        if (!body || !doc) return;
        var height = Math.max(
          body.scrollHeight || 0,
          body.offsetHeight || 0,
          doc.clientHeight || 0,
          doc.scrollHeight || 0,
          doc.offsetHeight || 0
        );
        try {
          window.parent.postMessage({ type: "LIZA_IFRAME_HEIGHT", height: height }, "*");
        } catch (_e) {}
      }

      function scheduleHeightSync() {
        sendParentHeight();
        setTimeout(sendParentHeight, 120);
        setTimeout(sendParentHeight, 480);
        setTimeout(sendParentHeight, 1200);
      }

      window.addEventListener("load", scheduleHeightSync, { once: true });
      window.addEventListener("resize", sendParentHeight);
      document.addEventListener("readystatechange", function () {
        if (document.readyState === "interactive" || document.readyState === "complete") {
          scheduleHeightSync();
        }
      });

      if (window.ResizeObserver) {
        var observer = new ResizeObserver(function () {
          sendParentHeight();
        });
        if (document.body) observer.observe(document.body);
        else window.addEventListener("load", function () {
          if (document.body) observer.observe(document.body);
        }, { once: true });
      }
    })();
  </script>
</body>
</html>
