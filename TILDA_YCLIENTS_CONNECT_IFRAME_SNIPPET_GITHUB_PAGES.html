<div style="width:100%;margin:0;padding:0;overflow:visible;min-height:100svh;">
  <iframe
    id="liza-yclients-connect-frame"
    data-base-src="https://seregaobr882.github.io/liza-tilda-assets/yclients-connect/index.html?v=4"
    src="https://seregaobr882.github.io/liza-tilda-assets/yclients-connect/index.html?v=4"
    style="display:block;width:100%;height:100svh;min-height:100svh;border:0;background:#f2f5fb;"
    loading="eager"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
</div>

<script>
(function () {
  var frame = document.getElementById('liza-yclients-connect-frame');
  if (!frame) return;
  var baseSrc = frame.getAttribute('data-base-src') || frame.getAttribute('src') || '';
  if (!baseSrc) return;

  var search = window.location.search || '';
  if (!search) {
    frame.src = baseSrc;
    return;
  }

  var separator = baseSrc.indexOf('?') === -1 ? '?' : '&';
  frame.src = baseSrc + separator + search.replace(/^\?/, '');
})();
</script>
